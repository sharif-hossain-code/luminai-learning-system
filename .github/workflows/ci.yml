name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: luminai
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: luminai_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U luminai -d luminai_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2.11
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    # CI-only values for disposable service containers. Not secrets.
    env:
      NODE_ENV: test
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000
      DATABASE_URL: postgresql://luminai:ci-only-password@localhost:5432/luminai_dev_unused
      TEST_DATABASE_URL: postgresql://luminai:ci-only-password@localhost:5432/luminai_test
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-not-used-anywhere-else
      TURBO_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (migrations, seed, API health)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm --filter @luminai/web exec playwright install --with-deps chromium

      - name: Web smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Policy (docs/testing/test-strategy.md): high and critical advisories fail the build.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
