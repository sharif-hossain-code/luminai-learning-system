packages:
  - apps/*
  - packages/*

# Only these dependencies may run install scripts.
onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - sharp
  - unrs-resolver
  - esbuild
  - argon2
  - msgpackr-extract

overrides:
  # GHSA-7589-6fvf-x4pw (ReDoS) in effect <=3.22.0, pulled in by @prisma/config 7.10.1.
  # Remove once Prisma ships a patched dependency.
  effect@<3.22.1: 3.22.1
